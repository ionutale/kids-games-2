<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF6E5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='6' r='5' fill='%23F7A8B8' stroke='%234A3728'/%3E%3Cpath d='M4 10h8l-4 5z' fill='%23E6B87A' stroke='%234A3728'/%3E%3C/svg%3E">
<title>Count</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-state="loading">
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="sym-scoop" viewBox="0 0 120 115">
      <circle cx="60" cy="60" r="54" fill="currentColor" stroke="#4A3728" stroke-width="3.5"></circle>
      <path d="M30 56 q10 -22 32 -24 q20 -2 28 16" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="7" stroke-linecap="round"></path>
      <circle cx="45" cy="82" r="6" fill="rgba(255,255,255,0.35)"></circle>
    </symbol>
    <symbol id="sym-cone" viewBox="0 0 120 85">
      <path d="M28 5 L92 5 L60 80 Z" fill="#E6B87A" stroke="#4A3728" stroke-width="3.5" stroke-linejoin="round"></path>
      <path d="M36 12 L80 12 M44 28 L71 28 M51 44 L64 44" stroke="#C98F4F" stroke-width="3" stroke-linecap="round"></path>
      <path d="M32 16 L56 74 M54 8 L72 62 M74 8 L88 50" stroke="#C98F4F" stroke-width="2" stroke-linecap="round" opacity="0.65"></path>
    </symbol>
    <symbol id="sym-logo" viewBox="0 0 120 190">
      <circle cx="60" cy="62" r="54" fill="#F7A8B8" stroke="#4A3728" stroke-width="3.5"></circle>
      <path d="M32 56 q10 -22 32 -24 q20 -2 28 16" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="7" stroke-linecap="round"></path>
      <path d="M30 116 L90 116 L60 184 Z" fill="#E6B87A" stroke="#4A3728" stroke-width="3.5" stroke-linejoin="round"></path>
      <path d="M42 124 L78 124 M48 138 L72 138 M54 152 L66 152" stroke="#C98F4F" stroke-width="3" stroke-linecap="round"></path>
    </symbol>
    <symbol id="sym-play" viewBox="0 0 24 24">
      <path d="M8.5 5.5 19 12 8.5 18.5z" fill="#FFF6E5" stroke="#4A3728" stroke-width="1.6" stroke-linejoin="round"></path>
    </symbol>
    <symbol id="sym-replay" viewBox="0 0 24 24">
      <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1" fill="none" stroke="#FFF6E5" stroke-width="2.6" stroke-linecap="round"></path>
      <path d="M3 3v5h5" fill="none" stroke="#FFF6E5" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>
    </symbol>
    <symbol id="sym-home" viewBox="0 0 24 24">
      <path d="M3.5 10.5 12 3.5l8.5 7" fill="none" stroke="#4A3728" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M5.5 9.5V20.5h13V9.5" fill="none" stroke="#4A3728" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M9.5 20.5v-5.5h5v5.5" fill="none" stroke="#4A3728" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
    </symbol>
    <symbol id="sym-arrow" viewBox="0 0 48 48">
      <path d="M24 6v26" fill="none" stroke="#4A3728" stroke-width="7" stroke-linecap="round"></path>
      <path d="M10 22 24 38l14-16" fill="none" stroke="#4A3728" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
    </symbol>
    <symbol id="sym-trophy" viewBox="0 0 24 24">
      <path d="M7 3h10v6a5 5 0 0 1-10 0z" fill="#F4A261" stroke="#4A3728" stroke-width="1.6" stroke-linejoin="round"></path>
      <path d="M7 4H4.5A2.5 2.5 0 0 0 7 8.6" fill="none" stroke="#4A3728" stroke-width="1.6" stroke-linecap="round"></path>
      <path d="M17 4h2.5A2.5 2.5 0 0 1 17 8.6" fill="none" stroke="#4A3728" stroke-width="1.6" stroke-linecap="round"></path>
      <path d="M12 14v4" fill="none" stroke="#4A3728" stroke-width="1.6" stroke-linecap="round"></path>
      <path d="M8 21h8l-1-3.5H9z" fill="#F4A261" stroke="#4A3728" stroke-width="1.6" stroke-linejoin="round"></path>
    </symbol>
  </defs>
</svg>

<main id="app">
  <section class="screen screen-loading" data-screen="loading"></section>

  <section class="screen screen-title" data-screen="title">
    <button id="logo" class="logo" type="button" aria-label="Ice cream. Hold for three seconds to reset progress.">
      <svg viewBox="0 0 120 190" aria-hidden="true"><use href="#sym-logo"></use></svg>
    </button>
    <h1 class="title-word">Count</h1>
    <button id="play" class="circle-btn play-btn" type="button" aria-label="Play">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#sym-play"></use></svg>
    </button>
  </section>

  <section class="screen screen-play" data-screen="play">
    <button id="home-play" class="circle-btn home-btn" type="button" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#sym-home"></use></svg>
    </button>
    <div id="field" class="field"></div>
  </section>

  <section class="screen screen-complete" data-screen="complete">
    <button id="home-complete" class="circle-btn home-btn" type="button" aria-label="Home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#sym-home"></use></svg>
    </button>
    <div class="complete-inner">
      <svg class="trophy" viewBox="0 0 24 24" aria-hidden="true"><use href="#sym-trophy"></use></svg>
      <button id="replay" class="circle-btn play-btn replay-btn" type="button" aria-label="Play again">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#sym-replay"></use></svg>
      </button>
    </div>
  </section>

  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
</main>
<script src="game.js"></script>
</body>
</html>
