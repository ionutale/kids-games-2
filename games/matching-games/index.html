<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Play</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='26' height='26' rx='8' fill='%23F2B84B'/%3E%3Crect x='34' y='4' width='26' height='26' rx='8' fill='%236FA8A0'/%3E%3Crect x='4' y='34' width='26' height='26' rx='8' fill='%23E8804C'/%3E%3Crect x='34' y='34' width='26' height='26' rx='8' fill='%238E7CC3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" data-state="loading">

  <!-- bg_room: soft mint play backdrop, radial gradient, subtle dots -->
  <svg class="bg-room" viewBox="0 0 1024 768" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="bgGrad" cx="50%" cy="40%" r="78%">
        <stop offset="0%" stop-color="#F6FCF9"/>
        <stop offset="55%" stop-color="#EAF6F1"/>
        <stop offset="100%" stop-color="#D6ECE2"/>
      </radialGradient>
    </defs>
    <rect width="1024" height="768" fill="url(#bgGrad)"/>
    <g fill="#6FA8A0" opacity="0.11">
      <circle cx="74" cy="96" r="15"/><circle cx="212" cy="52" r="8"/><circle cx="342" cy="132" r="11"/>
      <circle cx="486" cy="64" r="7"/><circle cx="620" cy="118" r="13"/><circle cx="742" cy="58" r="9"/>
      <circle cx="906" cy="104" r="14"/><circle cx="980" cy="212" r="7"/><circle cx="128" cy="248" r="9"/>
      <circle cx="286" cy="300" r="14"/><circle cx="58" cy="418" r="11"/><circle cx="196" cy="500" r="7"/>
      <circle cx="352" cy="452" r="12"/><circle cx="498" cy="524" r="9"/><circle cx="648" cy="470" r="14"/>
      <circle cx="806" cy="536" r="8"/><circle cx="948" cy="448" r="12"/><circle cx="104" cy="640" r="13"/>
      <circle cx="268" cy="700" r="8"/><circle cx="430" cy="636" r="10"/><circle cx="588" cy="712" r="14"/>
      <circle cx="736" cy="652" r="8"/><circle cx="890" cy="708" r="12"/><circle cx="968" cy="596" r="7"/>
    </g>
  </svg>

  <header class="topbar" id="topbar">
    <!-- HOME: 64x64, 24 px margin, top-left -->
    <button class="icon-btn home-btn" id="homeBtn" type="button" aria-label="Home" hidden>
      <svg class="art" viewBox="0 0 64 64" aria-hidden="true" focusable="false"><use href="#i-home"></use></svg>
    </button>
    <!-- prompt_card: pair pictogram + pip row (not interactive) -->
    <div class="prompt-card" id="promptCard" hidden aria-hidden="true">
      <svg class="prompt-pict" viewBox="0 0 140 140" aria-hidden="true" focusable="false"><use href="#i-prompt"></use></svg>
      <div class="pip-row" id="pipRow"></div>
    </div>
  </header>

  <main class="playfield" id="playfield">
    <div class="board" id="board" role="group" aria-label="Card board"></div>
  </main>

  <section class="screen title-screen" id="titleScreen" hidden>
    <button class="logo-btn" id="logoBtn" type="button"
            aria-label="Matching pairs board, hold three seconds to reset progress">
      <svg class="logo-art" viewBox="0 0 120 120" aria-hidden="true" focusable="false"><use href="#i-logo"></use></svg>
      <svg class="hold-ring" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
        <circle class="hold-ring-track" cx="60" cy="60" r="54"></circle>
        <circle class="hold-ring-fill" id="holdRingFill" cx="60" cy="60" r="54"></circle>
      </svg>
      <svg class="hold-check" id="holdCheck" viewBox="0 0 40 40" aria-hidden="true" focusable="false"><use href="#i-check"></use></svg>
    </button>
    <button class="icon-btn play-btn" id="playBtn" type="button" aria-label="Play">
      <svg class="art" viewBox="0 0 96 96" aria-hidden="true" focusable="false"><use href="#i-play"></use></svg>
    </button>
  </section>

  <section class="screen complete-screen" id="completeScreen" hidden>
    <svg class="trophy-art" viewBox="0 0 200 200" aria-hidden="true" focusable="false"><use href="#i-trophy"></use></svg>
    <button class="icon-btn replay-btn" id="replayBtn" type="button" aria-label="Play again">
      <svg class="art" viewBox="0 0 96 96" aria-hidden="true" focusable="false"><use href="#i-replay"></use></svg>
    </button>
  </section>

  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
</div>

<!-- inline SVG asset stubs (section 11) -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-home" viewBox="0 0 64 64">
      <path d="M32 8 L58 30 H50 V56 H14 V30 H6 Z" fill="#6FA8A0" stroke="#3E2C1E" stroke-width="3.5" stroke-linejoin="round"/>
      <rect x="25" y="38" width="14" height="18" rx="4" fill="#FFF8EC" stroke="#3E2C1E" stroke-width="3.5"/>
    </symbol>
    <symbol id="i-play" viewBox="0 0 96 96">
      <path d="M34 22 L74 48 L34 74 Z" fill="#6FA8A0" stroke="#3E2C1E" stroke-width="5" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-replay" viewBox="0 0 96 96">
      <path d="M48 18 A30 30 0 1 1 18 48" fill="none" stroke="#6FA8A0" stroke-width="10" stroke-linecap="round"/>
      <path d="M40 4 L40 32 L64 18 Z" fill="#6FA8A0" stroke="#3E2C1E" stroke-width="4" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="18.5" fill="#FFF8EC" stroke="#3E2C1E" stroke-width="2.5"/>
      <path d="M10 21 L17 28 L31 11" fill="none" stroke="#7BC47F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-logo" viewBox="0 0 120 120">
      <rect x="8" y="8" width="48" height="48" rx="12" fill="#F2B84B"/>
      <rect x="64" y="8" width="48" height="48" rx="12" fill="#6FA8A0"/>
      <rect x="8" y="64" width="48" height="48" rx="12" fill="#E8804C"/>
      <rect x="64" y="64" width="48" height="48" rx="12" fill="#8E7CC3"/>
      <path d="M26 60 L44 80 L92 26" fill="none" stroke="#3E2C1E" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-prompt" viewBox="0 0 140 140">
      <rect x="10" y="16" width="66" height="84" rx="14" fill="#6FA8A0" opacity="0.85"/>
      <rect x="48" y="34" width="70" height="88" rx="14" fill="#F2B84B"/>
      <path d="M62 80 L78 96 L106 60" fill="none" stroke="#3E2C1E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-trophy" viewBox="0 0 200 200">
      <path d="M62 40 H38 a22 30 0 0 0 26 38" fill="none" stroke="#E8B45C" stroke-width="13" stroke-linecap="round"/>
      <path d="M138 40 H162 a22 30 0 0 1 -26 38" fill="none" stroke="#E8B45C" stroke-width="13" stroke-linecap="round"/>
      <path d="M52 26 h96 v34 a48 48 0 0 1 -96 0 Z" fill="#F2B84B" stroke="#3E2C1E" stroke-width="5" stroke-linejoin="round"/>
      <path d="M100 42 l6 12 13 2 -9 9 2 13 -12 -6 -12 6 2 -13 -9 -9 13 -2 Z" fill="#FFF8EC"/>
      <rect x="90" y="106" width="20" height="32" fill="#E8B45C" stroke="#3E2C1E" stroke-width="5"/>
      <rect x="58" y="136" width="84" height="18" rx="9" fill="#E8B45C" stroke="#3E2C1E" stroke-width="5"/>
      <rect x="42" y="154" width="116" height="22" rx="11" fill="#F2B84B" stroke="#3E2C1E" stroke-width="5"/>
    </symbol>
  </defs>
</svg>

<script type="module" src="game.js"></script>
</body>
</html>
